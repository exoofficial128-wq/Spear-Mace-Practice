 info.textContent=(AUTO?'AUTO PLAY ON\n':'')+`FPS     ${fps|0}\nSPEED   ${(Math.hypot(P.vx,P.vz)*20).toFixed(1)} b/s\nFALL    ${P.fd.toFixed(1)} b\nTARGETS ${T.filter(t=>t.al).length}/${T.length}\nCOMBO   ${cb}\nTIME    ${fmt(gt)}\nMAP     ${MAP==1?'Stun Slam':'Default'}`+
  (sel==0?`\nSMASH   ${sm(P.fd).toFixed(1)} dmg\nWINDB   ${C.wb?RN[C.wb|0]:'off'}`:sel==1?`\nJAB     ${tier().dmg} dmg (${C.tier})\nLUNGE   ${C.lunge?RN[C.lunge|0]:'off'}\nHUNGER  infinite`:sel==2?`\nCHAIN   ${wc}`:sel==3?`\nCATCH   ${cc}`:`\nAXE     ${MAP==1?'STUN 2.5s':'9 dmg'}`);
 $('calc').textContent=calc;const c=$('chg');c.style.display=ch0&&sel==1?'block':'none';if(ch0){c.firstChild.style.width=Math.min(chT/tier().dl*100,100)+'%';c.firstChild.style.background=chT>=tier().dl?'#fff':'#888'}}

/* ===== MAIN LOOP (fixed step, FPS cap, vsync) ===== */
let last=performance.now(),acc=0,lr=0;
function loop(){C.vsync?requestAnimationFrame(loop):setTimeout(loop,0);
 const now=performance.now(),dt=Math.min((now-last)/1000,.25);last=now;
 if(state=='play'){acc+=dt;while(acc>=.05){tick();acc-=.05}gt+=dt;ST.time+=dt;if(pend&&performance.now()-pend>50){pend=0;if(sel==1)jab()}}
 if(C.fps&&now-lr<1000/C.fps-1.5)return;const rd=Math.min((now-lr)/1000,.25);lr=now;fps+=(1/Math.max(rd,1e-4)-fps)*.1;
 render(state=='play'?acc/.05:1,rd);if((hT+=rd)>.1){hT=0;if(state!='menu')updHud()}}

/* ===== INPUT ===== */
let rebind=null,FB=false,lockSkip=0,lockT=0,mX=-1,mY=-1,toastT=0;
const locked=()=>document.pointerLockElement===R.domElement;
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',9000)};
function lock(){const c=R.domElement;let tried=false;const plain=()=>{if(tried)return;tried=true;try{c.requestPointerLock()}catch(e){}};
 try{const r=c.requestPointerLock(C.raw?{unadjustedMovement:true}:undefined);if(r&&r.catch)r.catch(plain)}catch(e){plain()}
 clearTimeout(lockT);lockT=setTimeout(()=>{if(state=='play'&&!locked()){FB=true;R.domElement.style.cursor='none';toast('Mouse capture is blocked here (embedded/sandboxed preview?). Using fallback mouse look. For full control open index.html directly in Chrome/Edge/Firefox. Arrow keys also turn. Click the game to retry.')}},700)}
document.addEventListener('pointerlockchange',()=>{if(locked()){FB=false;lockSkip=3;R.domElement.style.cursor='';$('toast').style.display='none';return}
 if(state=='play'&&!FB)pauseGame()});
function pauseGame(){if(state!='play')return;state='pause';ch0=0;K={};tsp=tsn=false;R.domElement.style.cursor='';save();pause();if(locked())document.exitPointerLock()}
R.domElement.addEventListener('mousedown',()=>{if(state=='play'&&!locked())lock()});
function look(dx,dy){if(AUTO)return;const dg=1.2*Math.pow(.6*C.sens+.2,3)*Math.PI/180;P.yaw-=dx*dg;P.pit=Math.max(-1.5533,Math.min(1.5533,P.pit-dy*dg*(C.invY?-1:1)))}
addEventListener('mousemove',e=>{if(state!='play')return;mX=e.clientX;mY=e.clientY;if(!locked()&&!FB)return;if(lockSkip>0&&!FB){lockSkip--;return}
 const dx=e.movementX||0,dy=e.movementY||0;if(Math.abs(dx)>300||Math.abs(dy)>300)return;look(dx,dy)});
addEventListener('mousedown',e=>{if(state!='play'||!(locked()||FB))return;if(e.button==0||e.button==2||e.button==3){e.preventDefault();use(e.button==3?0:e.button)}});   /* MB4 (back button) = left click */
addEventListener('mouseup',e=>{if(e.button==3||e.button==4)e.preventDefault()});addEventListener('auxclick',e=>{if(state=='play')e.preventDefault()});
addEventListener('mouseup',e=>{if(e.button==2&&ch0&&state=='play')ch0=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(state!='play'||AUTO)return;selItem((sel+(e.deltaY>0?1:4))%5);e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{
 if(rebind){e.preventDefault();if(e.code!='Escape'){if(Object.entries(C.keys).some(([k,v])=>v==e.code&&k!=rebind.k)){rebind.err=1;ctrls(rebind.back);return}C.keys[rebind.k]=e.code;save()}const b=rebind.back;rebind=null;ctrls(b);return}
 if(e.code=='Escape'&&state!='play'&&scr.classList.contains('on')&&menuBack){e.preventDefault();menuBack();return}
 if(state!='play')return;
 if(e.code=='Escape'){e.preventDefault();pauseGame();return}
 if(e.code.startsWith('Arrow'))e.preventDefault();
 if(AUTO)return;
 const v=Object.values(C.keys);if(v.includes(e.code))e.preventDefault();if(e.repeat)return;K[e.code]=1;
 for(let i=0;i<5;i++)if(e.code==C.keys['s'+(i+1)])selItem(i)
 if(e.code==C.keys.ls)lungeSwap();if(e.code==C.keys.eat){food=20;sat=20;exh=0;calc='ATE: hunger refilled'}
 if(e.code==C.keys.sp&&C.tSprint)tsp=!tsp;if(e.code==C.keys.c&&C.tCrouch)tsn=!tsn});
addEventListener('keyup',e=>{K[e.code]=0});addEventListener('blur',()=>{K={};ch0=0});document.addEventListener('visibilitychange',()=>{K={};ch0=0});addEventListener('beforeunload',save);
/* keyboard / edge look (arrow keys always; screen-edge turning only in fallback mode) */
function kbLook(dt){if(state!='play')return;let dx=0,dy=0;const sp=900*dt;
 if(K.ArrowLeft)dx-=sp;if(K.ArrowRight)dx+=sp;if(K.ArrowUp)dy-=sp;if(K.ArrowDown)dy+=sp;
 if(dx||dy)look(dx,dy)}

/* ===== MENUS ===== */
const scr=$('scr');
let menuBack=null;   /* Esc inside a submenu = press its Back button */
function menu(title,els){menuBack=null;for(const x of els)if(x&&x.tagName=='BUTTON'&&x.textContent=='Back')menuBack=x.onclick;scr.innerHTML='';const h=document.createElement('h1');h.textContent=title;scr.append(h,...els);scr.classList.add('on')}
const B=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;return b};
const el=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};
const SET={video:[['fov','FOV',30,110,1],['fps','FPS limit',[30,60,90,120,144,165,240,0]],['vsync','VSync','b'],['qual','Visual quality',[.5,.75,1]],['shadows','Shadows','b'],['ao','Ambient occlusion','b'],['part','Particles','b'],['bob','View bobbing','b'],['shake','Camera shake','b']],
 graphics:[['gfx','Graphics level',['Flat','Normal','High','Ultra']],['cull','Frustum culling','b'],['fog','Custom fog','b'],['fogd','Fog start distance',34,1000,2],['shq','Shadow quality (High/Ultra)',['Blurry','Normal','Crisp']],['shd','Shadow distance (High/Ultra)',16,2460,4],['tod','Time of day (High/Ultra)',['Sunset','Noon','Night']],['cld','Cloud type (High/Ultra)',['Boxy','Volumetric']],['wave','Waving grass (Default = Ultra only)',['Default','On','Off']]],
 mouse:[['sens','Sensitivity',0,1,.01],['invY','Invert Y','b'],['raw','Raw mouse input','b']],
 game:[['tSprint','Toggle sprint','b'],['tCrouch','Toggle crouch','b'],['ind','Target indicators','b'],['dmg','Damage indicators','b'],['snd','Hit sounds','b']],
 gear:[['tier','Spear tier',['Wooden','Stone','Iron','Diamond','Netherite']],['lunge','Lunge level',0,3,1],['wb','Wind Burst level',0,3,1]],
 train:[['preset','Difficulty',['Beginner','Easy','Normal','Hard','Expert','Custom']],['count','Target count',1,25,1],['size','Target size',.4,2.5,.1],['hp','Target health',1,100,1],['spd','Move speed',0,4,.1],
  ['pat','Movement',['static','circular','horizontal','vertical','random','mixed']],['h','Target height',1,15,.5],['dist','Target distance',4,18,.5],['spawn','Respawn time (s)',.2,10,.2],['rand','Random placement','b']]};
function onSet(k,rr){if(k=='preset'){if(PRE[C.preset])Object.assign(C,PRE[C.preset])}else if(SET.train.some(d=>d[0]==k))C.preset='Custom';applyCfg();save();rr()}
function rowFor(d,rr){const [k,l,a,mn,st]=d,r=document.createElement('div'),lb=el('span',l);r.className='row';r.append(lb);let c;
 if(a=='b')c=B(C[k]?'On':'Off',()=>{C[k]=+!C[k];onSet(k,rr)});
 else if(Array.isArray(a)){c=document.createElement('select');a.forEach(o=>c.add(new Option(o||'Unlimited',o)));c.value=C[k];c.onchange=()=>{C[k]=isNaN(+c.value)?c.value:+c.value;onSet(k,rr)}}
 else{c=document.createElement('input');c.type='range';c.min=a;c.max=mn;c.step=st;c.value=C[k];let v;if(k=='shd'){v=document.createElement('input');v.type='number';v.min=a;v.max=mn;v.value=C[k];v.style.cssText='width:76px;background:#333;color:#fff;border:2px solid #aaa;padding:3px';c.style.width='90px';const fx=n=>Math.max(a,Math.min(mn,Math.round(+n||a)));v.onchange=()=>{C[k]=fx(v.value);v.value=C[k];c.value=C[k];applyCfg();onSet(k,rr)};c.oninput=()=>{C[k]=+c.value;v.value=c.value;applyCfg()}}else{v=el('span',C[k]);v.style.width='40px';c.oninput=()=>{C[k]=+c.value;v.textContent=c.value;applyCfg()}}c.onchange=()=>onSet(k,rr);r.append(v)}
 r.append(c);if(k=='fogd'&&!C.fog){r.querySelectorAll('input').forEach(x=>x.disabled=true);r.style.opacity=.5}
 if(['shq','shd','tod','cld','wave'].includes(k)&&!GH()){const F={tod:'Noon',cld:'Boxy',wave:'Off'};if(F[k]&&c.tagName=='SELECT')c.value=F[k];r.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);r.style.opacity=.5;r.title='Only available in High or Ultra graphics'}
 return r}
function sets(title,gs,back){const go=()=>sets(title,gs,back);menu(title,[...gs.flatMap(g=>[el('h2',g.toUpperCase()),...SET[g].map(d=>rowFor(d,go))]),...(gs.includes('graphics')?[(()=>{const b=B('Use default graphics settings',()=>{for(const k of GH()?['shq','shd','tod','cld','wave','fog','fogd']:['fog','fogd'])C[k]=D0[k];applyCfg();save();go()});return b})()]:[]),B('Back',()=>{if(gs[0]=='train')buildT();back()})])}
function setMenu(back){menu('SETTINGS',[...[['video','Video'],['mouse','Mouse'],['game','Game'],['graphics','Graphics']].map(([g,n])=>B(n,()=>sets(n.toUpperCase(),[g],()=>setMenu(back)))),B('Back',back)])}
const KL={f:'Forward',b:'Back',l:'Left',r:'Right',j:'Jump',sp:'Sprint',c:'Crouch',s1:'Slot 1 - Mace',s2:'Slot 2 - Spear',s3:'Slot 3 - Wind Charge',s4:'Slot 4 - Ender Pearl',s5:'Slot 5 - Axe',ls:'Lunge swap (spear jab, swap back)',eat:'Eat (refill hunger)'};
function ctrls(back){const rows=Object.keys(KL).map(k=>{const r=document.createElement('div');r.className='row';r.append(el('span',KL[k]));
  r.append(B(rebind&&rebind.k==k?'Press a key...':C.keys[k],()=>{rebind={k,back};ctrls(back)}));return r});
 menu('CONTROLS',[...rows,rebind&&rebind.err?el('p','That key is already bound. Pick another or press Esc.'):el('p','Click a bind, then press a key. Left click: mace hit / axe swing / spear jab (Lunge). Right click: throw wind charge or pearl; hold to charge the spear. Esc: pause.'),
  B('Reset to defaults',()=>{C.keys={...D0.keys};save();ctrls(back)}),B('Back',()=>{rebind=null;back()})]);if(rebind)rebind.err=0}
function stats(back){const a=ST.swings?(ST.hits/ST.swings*100).toFixed(1):'0.0',L=[['Total target hits',ST.hits],['Accuracy',a+'%'],['Best smash distance',ST.best.toFixed(1)+' b'],['Highest elevation',ST.elev.toFixed(1)+' b'],['Longest wind chain',ST.wind],['Longest pearl catch chain',ST.catch],['Total training time',fmt(ST.time)],['This session',fmt(gt)]];
 menu('STATISTICS',[...L.map(([k,v])=>{const r=document.createElement('div');r.className='row';r.append(el('span',k),el('b',v));return r}),B('Reset statistics',()=>{ST={hits:0,swings:0,best:0,elev:0,wind:0,catch:0,time:0};save();stats(back)}),B('Back',back)])}
function main(){state='menu';AUTO=false;hud.style.display='none';menu('MACE & SPEAR PRACTICE',[B('Play',mapMenu),B('Training Settings',()=>sets('TRAINING',['train','gear'],main)),B('Settings',()=>setMenu(main)),B('Controls',()=>ctrls(main)),B('Statistics',()=>stats(main)),
 B('About',()=>menu('ABOUT',[el('p','A lightweight PvP trainer in an open flat world with a blue sky. Five infinite items: mace, spear, wind charge, ender pearl, axe. Pick a map when you press Play; on Stun Slam you axe a target to stun it, then mace it. Movement runs on a 20 tick/s Minecraft-style physics step (0.08 gravity, 0.98 drag, 0.42 jump). Mace smash damage scales with fall distance; wind bursts propel you; pearls teleport on impact and can be caught mid-flight. Wind charges and pearls throw on right click only. The mace has Wind Burst (set the level in Training Settings). The spear jabs on left click (Lunge dashes you forward and costs hunger), charges while right click is held, and shares one attack meter with the mace like Java, so the Lunge swap key can carry the previous item\'s cooldown.'),B('Back',main)]))])}
function pause(){state=state=='play'?'pause':state;hud.style.display='block';menu('PAUSED',[B('Resume',play0),B('Auto Play: '+(AUTO?'On':'Off'),()=>{AUTO=!AUTO;AT=null;AF=null;AC0=0;ACD=0;ACT=-999;AG=0;if(AUTO){selItem(0);play0()}else pause()}),B('Settings',()=>setMenu(pause)),B('Controls',()=>ctrls(pause)),B('Restart Training',()=>{newSession();play0()}),B('Return to Main Menu',()=>{save();main()})])}
function play0(){state='play';scr.classList.remove('on');hud.style.display='block';last=performance.now();acc=0;FB=false;R.domElement.style.cursor='';lock()}
function mapMenu(){menu('SELECT MAP',[B('Default',()=>play(0)),el('p','Open training arena with floating targets. The axe just deals damage.'),B('Stun Slam',()=>play(1)),el('p','Every target is purple and cannot be hit. Hit one with the axe to turn it green for 2.5s, then switch to the mace and hit it before it turns purple again. Practice axe -> mace stun slams as fast as you can.'),B('Back',main)])}
function play(m){MAP=m|0;buildT();newSession();play0()}
function newSession(){Object.assign(P,{x:0,y:0,z:0,vx:0,vy:0,vz:0,px:0,py:0,pz:0,g:true,fd:0,yaw:0,pit:0});gt=0;cb=0;wc=0;cc=0;calc='';tp.t=0;ch0=0;atk=100;mt=100;pend=0;clickT=0;food=20;sat=5;exh=0;chT=0;gsw=0;tsp=tsn=false;PR.forEach(p=>{p.on=false;p.m.visible=false});AT=null;AC0=0;ACT=-999;ACD=0;AG=0;buildT()}

applyCfg();buildT();main();loop();
